<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="discBg" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#FAF8FD"/>
      <stop offset="100%" stop-color="#F2EAF8"/>
    </radialGradient>

    <!-- Outer Aura Gradient Ring -->
    <linearGradient id="auraRing" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B4F8A"/>
      <stop offset="35%" stop-color="#9333EA"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4F3072"/>
    </linearGradient>

    <!-- Inner Gold Ring -->
    <linearGradient id="goldRing" x1="35" y1="35" x2="477" y2="477" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Fluid Vortex Waves -->
    <linearGradient id="waveGrad" x1="92" y1="426" x2="422" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="topWaveGrad" x1="310" y1="115" x2="424" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Water Droplet Gradient -->
    <linearGradient id="dropGrad" x1="256" y1="122" x2="256" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="32%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B3A7E"/>
    </linearGradient>

    <!-- Droplet Specular Gradient -->
    <linearGradient id="sheenGrad" x1="254" y1="136" x2="182" y2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Hanger Gold Gradient -->
    <linearGradient id="hangerGrad" x1="178" y1="208" x2="334" y2="288" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Hook Gold Gradient -->
    <linearGradient id="hookGrad" x1="256" y1="140" x2="296" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Bubble Specular Gradient -->
    <radialGradient id="bubbleGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#BAE6FD" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#DDD6FE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6B4F8A" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Star Sparkle Gradient -->
    <linearGradient id="starGradGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#311347" flood-opacity="0.25"/>
    </filter>

    <filter id="hangerShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#230a38" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <circle cx="256" cy="260" r="236" fill="#4A3461" opacity="0.1"/>

  <!-- Main Circular Base Disc -->
  <circle cx="256" cy="256" r="238" fill="url(#discBg)"/>

  <!-- Outer Aura Gradient Ring -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#auraRing)" stroke-width="6"/>

  <!-- Inner Polished Gold Ring -->
  <circle cx="256" cy="256" r="221" fill="none" stroke="url(#goldRing)" stroke-width="2" opacity="0.85"/>

  <!-- Dynamic Swirling Wash Waves -->
  <path d="M 92 255 C 112 355 175 420 268 426 C 362 388 420 305 422 235 C 388 208 356 242 322 290 C 270 312 214 292 158 238 C 118 204 92 255 92 255 Z"
        fill="url(#waveGrad)"/>
  
  <path d="M 310 115 C 382 142 424 192 415 232 C 378 202 340 160 310 115 Z"
        fill="url(#topWaveGrad)"/>

  <!-- Central Water Droplet (Wash & Aura Core) -->
  <g filter="url(#shadowFilter)">
    <path d="M 256 122 
             C 240 166 166 248 164 314 
             C 162 368 206 408 256 408 
             C 306 408 350 368 348 314 
             C 346 248 272 166 256 122 Z" 
          fill="url(#dropGrad)"/>

    <!-- Droplet 3D Glass Specular Sheen (Curved Left Shoulder) -->
    <path d="M 254 136 
             C 240 174 186 244 182 308 
             C 181 336 192 356 204 368 
             C 195 350 190 330 192 304 
             C 196 248 244 178 254 136 Z" 
          fill="url(#sheenGrad)"/>

    <!-- Droplet Subtle Right Sheen -->
    <path d="M 262 144 
             C 278 176 316 236 324 280 
             C 320 254 296 202 268 154 Z" 
          fill="#FFFFFF" opacity="0.3"/>

    <!-- Bottom Reflected Cyan Glow -->
    <ellipse cx="256" cy="380" rx="48" ry="18" fill="#38BDF8" opacity="0.45"/>
  </g>

  <!-- Luxury Couture Garment Hanger -->
  <g filter="url(#hangerShadow)">
    <!-- Hook -->
    <path d="M 256 208 L 256 176 
             C 256 158 266 146 280 144 
             C 296 142 296 160 282 168 
             C 274 172 268 180 268 190" 
          fill="none" stroke="url(#hookGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Hook Tip Bead -->
    <circle cx="268" cy="189" r="3.2" fill="#FEF9C3"/>

    <!-- Hanger Triangular Frame with Cutout -->
    <path d="M 256 208 
             L 182 276 
             C 178 280 181 288 190 288 
             L 322 288 
             C 331 288 334 280 330 276 
             L 256 208 Z 
             M 256 226 
             L 310 268 
             L 202 268 
             Z" 
          fill="url(#hangerGrad)" fill-rule="evenodd"/>

    <!-- High-Gloss Specular Highlight Line -->
    <path d="M 194 273 L 256 220 L 318 273" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="198" y1="280" x2="314" y2="280" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Translucent Laundry Glass Bubbles -->
  <g>
    <!-- Bubble 1 -->
    <circle cx="136" cy="205" r="18" fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-width="1.4" opacity="0.95"/>
    <ellipse cx="131" cy="199" rx="6" ry="3.2" fill="#FFFFFF" opacity="0.85" transform="rotate(-30 131 199)"/>

    <!-- Bubble 2 -->
    <circle cx="376" cy="222" r="14" fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>
    <ellipse cx="372" cy="217" rx="4.5" ry="2.4" fill="#FFFFFF" opacity="0.85" transform="rotate(-30 372 217)"/>

    <!-- Bubble 3 -->
    <circle cx="130" cy="322" r="10" fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-width="1" opacity="0.85"/>
    <ellipse cx="127" cy="318" rx="3.2" ry="1.8" fill="#FFFFFF" opacity="0.85" transform="rotate(-30 127 318)"/>

    <!-- Bubble 4 -->
    <circle cx="370" cy="340" r="8" fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- Pure Diamond Sparkle Stars -->
  <!-- Top Right Prominent Gold Star -->
  <g transform="translate(376, 124)">
    <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="url(#starGradGold)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Left Gold Star -->
  <g transform="translate(140, 376)">
    <path d="M 0 -19 Q 0 0 19 0 Q 0 0 0 19 Q 0 0 -19 0 Q 0 0 0 -19 Z" fill="url(#starGradGold)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Crown Cyan Star -->
  <g transform="translate(256, 106)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#38BDF8"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Mid Right Delicate Star -->
  <g transform="translate(396, 280)">
    <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11 Z" fill="url(#starGradGold)" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF"/>
  </g>
</svg>
